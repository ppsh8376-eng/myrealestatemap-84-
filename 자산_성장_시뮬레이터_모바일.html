<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>자산 성장 시뮬레이터 (모바일/웹 버젼)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background-color: #f4f6f8; -webkit-font-smoothing: antialiased; }
        .input-box { border: 1px solid #d1d5db; border-radius: 6px; padding: 8px 10px; width: 100%; font-size: 13px; outline: none; transition: all 0.2s; background-color: #ffffff; }
        .input-box:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        .cell-input { width: 100%; border: none; background: transparent; text-align: right; outline: none; font-family: inherit; font-size: inherit; color: inherit; padding: 0; margin: 0; transition: background-color 0.1s; cursor: text;}
        .cell-input:focus { background-color: rgba(59, 130, 246, 0.1); border-radius: 4px; }
        .blurred { color: #9ca3af !important; font-style: italic; }
        .bg-blurred { background-color: #e5e7eb !important; }
        .anchor { background-color: #fef08a !important; color: #b91c1c !important; font-weight: bold !important; font-style: normal !important; }
        th, td { border-bottom: 1px solid #e5e7eb; padding: 10px 12px; white-space: nowrap; }
        th { background-color: #f9fafb; color: #6b7280; font-weight: 600; text-align: center; user-select: none;}
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        input[type="text"] { appearance: none; }
        
        .no-select { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
    </style>
</head>
<body class="p-3 md:p-8 text-gray-800">
    <div class="max-w-7xl mx-auto">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-5 gap-4">
            <h1 class="text-2xl font-bold text-gray-900 flex items-center">
                자산 성장 시뮬레이터 <span class="text-sm font-normal text-gray-500 ml-2">Web Ver.</span>
            </h1>
            
            <div class="flex flex-wrap gap-2 w-full md:w-auto">
                <button onclick="copySyncCode()" id="btnCopy" class="flex-1 md:flex-none px-3 py-2 bg-white border border-gray-300 rounded text-xs font-bold text-gray-700 shadow-sm">📱코드 내보내기</button>
                <button onclick="pasteSyncCode()" class="flex-1 md:flex-none px-3 py-2 bg-white border border-gray-300 rounded text-xs font-bold text-gray-700 shadow-sm">📥코드 불러오기</button>
                
                <label class="cursor-pointer flex-1 md:flex-none px-3 py-2 bg-white border border-gray-300 rounded text-xs font-bold text-gray-700 shadow-sm transition-colors flex items-center justify-center">
                    📂 JSON 열기
                    <input type="file" id="fileImport" accept=".json" style="display:none;" onchange="importJsonFile(event)">
                </label>
                <button id="btnSave" onclick="saveDataLocal()" class="flex-1 md:flex-none px-4 py-2 bg-blue-600 rounded-lg text-sm font-bold text-white shadow-sm transition-colors">저장(로컬)</button>
            </div>
        </div>

        <!-- Input Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-5 mb-5">
            
            <!-- Group 1: Career -->
            <div class="bg-blue-50/40 rounded-xl shadow-sm border border-blue-200 p-4">
                <h3 class="text-sm font-bold text-blue-800 mb-4 flex items-center gap-1.5">
                    <span class="text-base">🏢</span> 직장 및 소득 설정
                </h3>
                <div class="grid grid-cols-2 gap-3 md:gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">계약 연봉(원)</label>
                        <input type="text" id="salary" inputmode="numeric" class="input-box trigger-calc" value="53,060,000">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">연봉 인상률(%)</label>
                        <input type="text" id="salaryInc" inputmode="decimal" class="input-box trigger-calc" value="3">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">연봉 상한선(원)</label>
                        <input type="text" id="salaryCeil" inputmode="numeric" class="input-box trigger-calc" value="150,000,000">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">당해 성과급 비율(%)</label>
                        <input type="text" id="bonusP0" inputmode="decimal" class="input-box trigger-calc" value="80">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">1년 이연 성과급(%)</label>
                        <input type="text" id="bonusP1" inputmode="decimal" class="input-box trigger-calc" value="10">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">2년 이연 성과급(%)</label>
                        <input type="text" id="bonusP2" inputmode="decimal" class="input-box trigger-calc" value="10">
                    </div>
                </div>
            </div>

            <!-- Group 2: Asset & Investment -->
            <div class="bg-emerald-50/40 rounded-xl shadow-sm border border-emerald-200 p-4">
                <h3 class="text-sm font-bold text-emerald-800 mb-4 flex items-center gap-1.5">
                    <span class="text-base">📈</span> 자산 및 투자 설정
                </h3>
                <div class="grid grid-cols-2 gap-3 md:gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1 flex justify-between items-center">
                            현재 순자산(원)
                            <button onclick="toggleNw()" id="btnToggleNw" class="text-emerald-600 hover:text-emerald-800 focus:outline-none">👁️ 숨기기</button>
                        </label>
                        <input type="text" id="netWorth" inputmode="numeric" class="input-box trigger-calc font-semibold text-emerald-900" value="472,242,478">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">저축률(%)</label>
                        <input type="text" id="savingsRate" inputmode="decimal" class="input-box trigger-calc" value="70">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">투자 수익률(%)</label>
                        <input type="text" id="returnRate" inputmode="decimal" class="input-box trigger-calc" value="15">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">은퇴 연도(년)</label>
                        <input type="text" id="retYear" inputmode="numeric" class="input-box trigger-calc" value="2050">
                    </div>
                </div>
            </div>

            <!-- Group 3: Real Estate -->
            <div class="bg-orange-50/40 rounded-xl shadow-sm border border-orange-200 p-4">
                <h3 class="text-sm font-bold text-orange-800 mb-4 flex items-center gap-1.5">
                    <span class="text-base">🏠</span> 부동산 설정
                </h3>
                <div class="grid grid-cols-2 gap-3 md:gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">원베일리 24평(원)</label>
                        <input type="text" id="re24" inputmode="numeric" class="input-box trigger-calc" value="2,800,000,000">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">원베일리 34평(원)</label>
                        <input type="text" id="re34" inputmode="numeric" class="input-box trigger-calc" value="4,000,000,000">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">부동산 상승률(%)</label>
                        <input type="text" id="reRate" inputmode="decimal" class="input-box trigger-calc" value="4">
                    </div>
                </div>
            </div>
            
        </div>

        <!-- Info & Reset -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-3 gap-3">
            <p class="text-emerald-700 text-xs md:text-sm bg-emerald-50 px-3 py-2 rounded-lg border border-emerald-100 w-full md:w-auto">
                💡 <b>PC 조작:</b> 표 셀 드래그 후 <b>Ctrl+Enter</b>로 일괄 수정! <br>
                💡 <b>GitHub 연동:</b> Github에 이 html과 <code>asset_simulator_config.json</code>이 같이 있으면 자동으로 불러옵니다!
            </p>
            <button id="btnReset" onclick="resetAnchor()" style="display:none;" class="w-full md:w-auto px-4 py-2 bg-red-50 border border-red-300 text-red-700 rounded-lg text-sm font-bold shadow-sm whitespace-nowrap active:bg-red-100 transition-colors">
                🔄 기준점 초기화 (블러 해제)
            </button>
        </div>

        <!-- Table -->
        <div class="table-container bg-white rounded-xl shadow-sm border border-gray-200 no-select" id="tableWrapper">
            <table class="w-full text-xs md:text-sm text-left">
                <thead>
                    <tr>
                        <th class="sticky left-0 bg-gray-50 z-10 shadow-[1px_0_0_0_#e5e7eb]">연도</th>
                        <th>나이</th>
                        <th class="bg-blue-50 text-blue-800">영업이익(조) ✏️</th>
                        <th>세전 연봉</th>
                        <th>세전 성과급</th>
                        <th>세전 총수입</th>
                        <th class="text-gray-900">세후 수입(추산)</th>
                        <th>본인 저축액</th>
                        <th class="bg-fuchsia-50 text-fuchsia-800">여자친구 저축 ✏️</th>
                        <th class="text-indigo-800">당해 총 저축액</th>
                        <th class="bg-red-50 text-red-800">누적 순자산 ✏️</th>
                        <th class="bg-emerald-50 text-emerald-800">원베일리 24평</th>
                        <th class="bg-emerald-50 text-emerald-800">원베일리 34평</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
        
    </div>

    <script>
        let tableData = {};
        let anchorYear = null;
        let hideNw = false;

        function toggleNw() {
            hideNw = !hideNw;
            const btn = document.getElementById('btnToggleNw');
            const input = document.getElementById('netWorth');
            if (hideNw) {
                btn.innerText = "👁️ 보기";
                input.type = "password";
            } else {
                btn.innerText = "👁️ 숨기기";
                input.type = "text";
            }
            renderTable();
        }

        // --- Core Formatting ---
        function formatNumber(num) { return Math.round(num).toLocaleString('ko-KR'); }
        function parseNumber(str) { if (!str) return 0; return parseFloat(str.toString().replace(/,/g, '')) || 0; }

        function calcAfterTax(grossIncome) {
            const pension = Math.min(grossIncome, 77880000) * 0.045;
            const health = grossIncome * 0.03545;
            const longTermCare = health * 0.1295;
            const employment = grossIncome * 0.009;
            const deductions = pension + health + longTermCare + employment;
            const taxableIncome = grossIncome - deductions;
            
            let incomeTax = 0;
            if (taxableIncome <= 14000000) incomeTax = taxableIncome * 0.06;
            else if (taxableIncome <= 50000000) incomeTax = 840000 + (taxableIncome - 14000000) * 0.15;
            else if (taxableIncome <= 88000000) incomeTax = 6240000 + (taxableIncome - 50000000) * 0.24;
            else if (taxableIncome <= 150000000) incomeTax = 15360000 + (taxableIncome - 88000000) * 0.35;
            else if (taxableIncome <= 300000000) incomeTax = 37060000 + (taxableIncome - 150000000) * 0.38;
            else if (taxableIncome <= 500000000) incomeTax = 94060000 + (taxableIncome - 300000000) * 0.40;
            else if (taxableIncome <= 1000000000) incomeTax = 174060000 + (taxableIncome - 500000000) * 0.42;
            else incomeTax = 384060000 + (taxableIncome - 1000000000) * 0.45;
                
            return Math.max(0, grossIncome - (deductions + incomeTax + (incomeTax * 0.1)));
        }

        // --- Render Table ---
        function renderTable() {
            const startYear = 2026;
            const retYear = parseInt(document.getElementById('retYear').value) || 2050;
            
            let currentNetWorth = parseNumber(document.getElementById('netWorth').value);
            let currentSalary = parseNumber(document.getElementById('salary').value);
            const salaryInc = parseNumber(document.getElementById('salaryInc').value) / 100;
            const salaryCeil = parseNumber(document.getElementById('salaryCeil').value);
            
            const savingsRate = parseNumber(document.getElementById('savingsRate').value) / 100;
            const returnRate = parseNumber(document.getElementById('returnRate').value) / 100;
            
            let re24 = parseNumber(document.getElementById('re24').value);
            let re34 = parseNumber(document.getElementById('re34').value);
            const reRate = parseNumber(document.getElementById('reRate').value) / 100;

            const p0 = parseNumber(document.getElementById('bonusP0').value) / 100;
            const p1 = parseNumber(document.getElementById('bonusP1').value) / 100;
            const p2 = parseNumber(document.getElementById('bonusP2').value) / 100;
            
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            const netWorthInput = document.getElementById('netWorth');
            if (anchorYear !== null) netWorthInput.classList.add('bg-gray-100', 'text-gray-400');
            else netWorthInput.classList.remove('bg-gray-100', 'text-gray-400');

            document.getElementById('btnReset').style.display = anchorYear !== null ? 'block' : 'none';

            // Phase 1: Calculate Base Bonuses for all years
            let bonusHistory = {};
            let tempSal = currentSalary;
            for (let year = startYear; year <= retYear; year++) {
                const overrides = tableData[year] || {};
                const expectedOp = overrides.op !== undefined ? overrides.op : 47.2;
                const baseUnit = tempSal / 20.0;
                const bonusPercent = 29.64 * (expectedOp / 47.2063);
                bonusHistory[year] = baseUnit * bonusPercent;
                tempSal = Math.min(tempSal * (1 + salaryInc), salaryCeil);
            }
            bonusHistory[2024] = bonusHistory[2026];
            bonusHistory[2025] = bonusHistory[2026];

            // Phase 2: Render Table
            for (let year = startYear; year <= retYear; year++) {
                const age = 30 + (year - startYear);
                const overrides = tableData[year] || {};
                const expectedOp = overrides.op !== undefined ? overrides.op : 47.2;
                const gfSavings = overrides.gf !== undefined ? overrides.gf : 0;
                
                const isPastRow = anchorYear !== null && year < anchorYear;
                const isAnchorRow = anchorYear === year;
                const isBlurred = isPastRow || isAnchorRow;
                const bgClass = isBlurred ? 'bg-blurred' : 'bg-white';
                
                // Deferred bonus calculation
                const bonusAmount = (bonusHistory[year] * p0) + (bonusHistory[year-1] * p1) + (bonusHistory[year-2] * p2);
                
                const grossIncome = currentSalary + bonusAmount;
                const netIncome = calcAfterTax(grossIncome);
                const mySavings = netIncome * savingsRate;
                const totalSavings = mySavings + gfSavings;
                
                if (isAnchorRow) currentNetWorth = overrides.nw;
                else currentNetWorth = (currentNetWorth * (1 + returnRate)) + totalSavings;
                
                const tr = document.createElement('tr');
                tr.className = bgClass;
                
                const yearAgeClass = isPastRow ? 'blurred' : 'font-medium text-gray-900';
                const yearBg = isPastRow ? 'bg-gray-200' : 'bg-white';
                
                tr.innerHTML += `<td class="text-center sticky left-0 z-10 shadow-[1px_0_0_0_#e5e7eb] ${yearBg} ${yearAgeClass}">${year}년</td>`;
                tr.innerHTML += `<td class="text-center ${yearAgeClass}">${age}세</td>`;
                
                const txtClass = isBlurred ? 'blurred' : '';
                
                // Editable: OP
                const opColor = isBlurred ? '' : 'bg-blue-50 text-blue-700 font-bold';
                tr.innerHTML += `<td class="${opColor} ${txtClass} p-0"><input type="text" inputmode="decimal" class="cell-input p-2.5" data-year="${year}" data-key="op" value="${expectedOp}" onchange="updateData(${year}, 'op', this.value)" onfocus="this.value=this.value.replace(/,/g,'')" onblur="this.value=formatNumber(this.value)"></td>`;
                
                // Readonlys
                tr.innerHTML += `<td class="text-right ${txtClass}">${formatNumber(currentSalary)}</td>`;
                tr.innerHTML += `<td class="text-right ${txtClass}">${formatNumber(bonusAmount)}</td>`;
                tr.innerHTML += `<td class="text-right ${txtClass}">${formatNumber(grossIncome)}</td>`;
                tr.innerHTML += `<td class="text-right ${txtClass} ${!isBlurred ? 'font-medium text-gray-900' : ''}">${formatNumber(netIncome)}</td>`;
                tr.innerHTML += `<td class="text-right ${txtClass}">${formatNumber(mySavings)}</td>`;
                
                // Editable: GF Savings
                const gfColor = isBlurred ? '' : 'bg-fuchsia-50 text-fuchsia-700 font-medium';
                tr.innerHTML += `<td class="${gfColor} ${txtClass} p-0"><input type="text" inputmode="numeric" class="cell-input p-2.5" data-year="${year}" data-key="gf" value="${formatNumber(gfSavings)}" onchange="updateData(${year}, 'gf', this.value)" onfocus="this.value=this.value.replace(/,/g,'')" onblur="this.value=formatNumber(this.value)"></td>`;
                
                // Readonly: Total Savings
                tr.innerHTML += `<td class="text-right ${txtClass} ${!isBlurred ? 'text-indigo-700 font-bold' : ''}">${formatNumber(totalSavings)}</td>`;
                
                // Editable: Net Worth Anchor
                let nwClass = txtClass;
                if (isAnchorRow) nwClass = 'anchor';
                else if (!isBlurred) nwClass = 'text-red-600 font-bold';
                
                const nwType = hideNw ? 'password' : 'text';
                tr.innerHTML += `<td class="${nwClass} text-right p-0"><input type="${nwType}" inputmode="numeric" class="cell-input p-2.5" data-year="${year}" data-key="nw" value="${formatNumber(currentNetWorth)}" onchange="updateAnchor(${year}, this.value)" onfocus="this.value=this.value.replace(/,/g,'')" onblur="this.value=formatNumber(this.value)"></td>`;
                
                // Readonly: Real Estates
                const reClass = isBlurred ? txtClass : 'bg-emerald-50 text-emerald-700 font-bold';
                tr.innerHTML += `<td class="text-right ${reClass}">${formatNumber(re24)}</td>`;
                tr.innerHTML += `<td class="text-right ${reClass}">${formatNumber(re34)}</td>`;
                
                tbody.appendChild(tr);
                
                currentSalary = Math.min(currentSalary * (1 + salaryInc), salaryCeil);
                re24 *= (1 + reRate);
                re34 *= (1 + reRate);
            }
        }

        // --- Data Updates ---
        function updateData(year, key, value) {
            if (!tableData[year]) tableData[year] = {};
            tableData[year][key] = parseNumber(value);
            renderTable();
        }

        function updateAnchor(year, value) {
            if (value.trim() === '') {
                if (anchorYear === year) {
                    anchorYear = null;
                    if(tableData[year]) delete tableData[year].nw;
                }
            } else {
                anchorYear = year;
                if (!tableData[year]) tableData[year] = {};
                tableData[year].nw = parseNumber(value);
            }
            renderTable();
        }

        function resetAnchor() {
            anchorYear = null;
            for (let y in tableData) { delete tableData[y].nw; }
            renderTable();
        }

        // --- State Management (Get/Set Object) ---
        function getSaveDataObj() {
            return {
                netWorth: parseNumber(document.getElementById('netWorth').value),
                salary: parseNumber(document.getElementById('salary').value),
                salaryInc: parseNumber(document.getElementById('salaryInc').value),
                salaryCeil: parseNumber(document.getElementById('salaryCeil').value),
                savingsRate: parseNumber(document.getElementById('savingsRate').value),
                returnRate: parseNumber(document.getElementById('returnRate').value),
                re24: parseNumber(document.getElementById('re24').value),
                re34: parseNumber(document.getElementById('re34').value),
                reRate: parseNumber(document.getElementById('reRate').value),
                retYear: parseNumber(document.getElementById('retYear').value),
                bonusP0: parseNumber(document.getElementById('bonusP0').value),
                bonusP1: parseNumber(document.getElementById('bonusP1').value),
                bonusP2: parseNumber(document.getElementById('bonusP2').value),
                hideNw: hideNw,
                anchorYear: anchorYear,
                tableData: tableData
            };
        }

        function applySaveDataObj(data) {
            if(!data) return;
            // Migration
            if (data.tableData === undefined && data.net_worth !== undefined) {
                data.netWorth = data.net_worth;
                data.salaryInc = data.salary_inc;
                data.salaryCeil = data.salary_ceiling;
                data.savingsRate = data.savings_rate;
                data.returnRate = data.return_rate;
                data.re24 = data.re_24;
                data.re34 = data.re_34;
                data.reRate = data.re_rate;
                data.retYear = data.retirement_year;
                
                data.tableData = {};
                const aRow = data.anchor_row !== undefined ? data.anchor_row : -1;
                if (aRow !== -1) data.anchorYear = 2026 + aRow;
                else data.anchorYear = null;
                
                const opData = data.op_data || [];
                const gfData = data.gf_data || [];
                const len = Math.max(opData.length, gfData.length);
                for(let i=0; i<len; i++) {
                    const y = 2026 + i;
                    const r = {};
                    if(opData[i] && parseFloat(opData[i].toString().replace(/,/g,'')) !== 47.2) r.op = parseFloat(opData[i].toString().replace(/,/g,''));
                    if(gfData[i] && parseFloat(gfData[i].toString().replace(/,/g,'')) !== 0) r.gf = parseFloat(gfData[i].toString().replace(/,/g,''));
                    if(i === aRow) r.nw = parseFloat(data.manual_net_worth || 0);
                    if(Object.keys(r).length > 0) data.tableData[y] = r;
                }
            }

            document.getElementById('netWorth').value = formatNumber(data.netWorth !== undefined ? data.netWorth : 472242478);
            document.getElementById('salary').value = formatNumber(data.salary !== undefined ? data.salary : 53060000);
            document.getElementById('salaryInc').value = data.salaryInc || '3';
            document.getElementById('salaryCeil').value = formatNumber(data.salaryCeil !== undefined ? data.salaryCeil : 150000000);
            document.getElementById('savingsRate').value = data.savingsRate || '70';
            document.getElementById('returnRate').value = data.returnRate || '15';
            document.getElementById('re24').value = formatNumber(data.re24 !== undefined ? data.re24 : 2800000000);
            document.getElementById('re34').value = formatNumber(data.re34 !== undefined ? data.re34 : 4000000000);
            document.getElementById('reRate').value = data.reRate || '4';
            document.getElementById('retYear').value = data.retYear || '2050';
            
            document.getElementById('bonusP0').value = data.bonusP0 !== undefined ? data.bonusP0 : 80;
            document.getElementById('bonusP1').value = data.bonusP1 !== undefined ? data.bonusP1 : 10;
            document.getElementById('bonusP2').value = data.bonusP2 !== undefined ? data.bonusP2 : 10;
            
            if (data.hideNw !== undefined && data.hideNw !== hideNw) {
                toggleNw(); // syncs UI button and state
            }
            
            anchorYear = data.anchorYear !== undefined ? data.anchorYear : null;
            tableData = data.tableData || {};
            renderTable();
        }

        // --- Local & File Syncing ---
        function saveDataLocal() {
            localStorage.setItem('simulatorDataMobile', JSON.stringify(getSaveDataObj()));
            const btn = document.getElementById('btnSave');
            btn.innerText = '저장 완료! ✓';
            btn.classList.replace('bg-blue-600', 'bg-emerald-500');
            setTimeout(() => { btn.innerText = '저장(로컬)'; btn.classList.replace('bg-emerald-500', 'bg-blue-600'); }, 2000);
        }

        function loadDataLocal() {
            const stored = localStorage.getItem('simulatorDataMobile');
            if (stored) {
                applySaveDataObj(JSON.parse(stored));
            }
        }

        function importJsonFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    applySaveDataObj(data);
                    alert("JSON 파일을 성공적으로 불러왔습니다!");
                } catch (err) {
                    alert("잘못된 JSON 파일입니다.");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        async function fetchGithubConfig() {
            try {
                const response = await fetch('asset_simulator_config.json', { cache: "no-store" });
                if (response.ok) {
                    const data = await response.json();
                    applySaveDataObj(data);
                    console.log("Loaded GitHub/Server config.json!");
                    return true;
                }
            } catch (e) {
                console.log("No remote config.json found or running locally.");
            }
            return false;
        }

        // --- Copy / Paste Sync (Base64 URL encoding) ---
        function copySyncCode() {
            const jsonStr = JSON.stringify(getSaveDataObj());
            const b64 = btoa(encodeURIComponent(jsonStr));
            navigator.clipboard.writeText(b64).then(() => {
                const btn = document.getElementById('btnCopy');
                btn.innerText = '복사 완료! ✓';
                btn.classList.replace('bg-white', 'bg-emerald-100');
                setTimeout(() => { btn.innerText = '📱코드 내보내기'; btn.classList.replace('bg-emerald-100', 'bg-white'); }, 2000);
            });
        }

        function pasteSyncCode() {
            const b64 = prompt("PC(.exe)나 다른 기기에서 복사한 영문 코드를 붙여넣어 주세요:");
            if (b64 && b64.trim() !== '') {
                try {
                    const jsonStr = decodeURIComponent(atob(b64.trim()));
                    applySaveDataObj(JSON.parse(jsonStr));
                    alert("성공적으로 연동되었습니다!");
                } catch (e) {
                    alert("올바르지 않은 코드입니다.");
                }
            }
        }

        // --- Multi Drag & Ctrl+Enter Selection Logic ---
        let isDragging = false;
        document.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('cell-input')) {
                document.querySelectorAll('.cell-input').forEach(el => { el.dataset.selected = 'false'; el.style.backgroundColor = ''; });
                e.target.dataset.selected = 'true';
                e.target.style.backgroundColor = 'rgba(59, 130, 246, 0.2)';
                isDragging = true;
            } else {
                isDragging = false; 
                if(!e.target.closest('#tableWrapper')) {
                    document.querySelectorAll('.cell-input').forEach(el => { el.dataset.selected = 'false'; el.style.backgroundColor = ''; });
                }
            }
        });
        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('mouseover', (e) => {
            if (isDragging && e.target.classList.contains('cell-input')) {
                e.target.dataset.selected = 'true';
                e.target.style.backgroundColor = 'rgba(59, 130, 246, 0.2)';
            }
        });
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                const active = document.activeElement;
                if (active && active.classList.contains('cell-input')) {
                    const val = active.value;
                    let updated = false;
                    document.querySelectorAll('.cell-input[data-selected="true"]').forEach(el => {
                        el.value = val;
                        const year = parseInt(el.dataset.year);
                        const key = el.dataset.key;
                        
                        if (key === 'nw') {
                            if (val.trim() === '') {
                                if (anchorYear === year) { anchorYear = null; if (tableData[year]) delete tableData[year].nw; }
                            } else {
                                anchorYear = year;
                                if (!tableData[year]) tableData[year] = {};
                                tableData[year].nw = parseNumber(val);
                            }
                        } else {
                            if (!tableData[year]) tableData[year] = {};
                            tableData[year][key] = parseNumber(val);
                        }
                        updated = true;
                    });
                    if (updated) {
                        active.blur();
                        renderTable();
                    }
                }
            }
        });

        // --- Init ---
        window.onload = async () => {
            document.querySelectorAll('.trigger-calc').forEach(el => {
                el.addEventListener('input', () => { renderTable(); });
                if(!['salaryInc', 'savingsRate', 'returnRate', 'reRate', 'retYear', 'bonusP0', 'bonusP1', 'bonusP2'].includes(el.id)) {
                    el.addEventListener('blur', function() { this.value = formatNumber(parseNumber(this.value)); renderTable(); });
                    el.addEventListener('focus', function() { this.value = this.value.replace(/,/g, ''); });
                }
            });
            
            const fromServer = await fetchGithubConfig();
            if (!fromServer) {
                const stored = localStorage.getItem('simulatorDataMobile');
                if (stored) applySaveDataObj(JSON.parse(stored));
                else renderTable(); 
            }
        };
    </script>
</body>
</html>
