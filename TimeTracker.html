<!-- TimeTracker.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>시간 기록 앱</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>할 일 기록</h1>
            <div class="date-picker-wrapper">
                <input type="date" id="date-picker">
            </div>
        </header>
        
        <section id="import-section">
            <label for="excel-input" class="section-label">엑셀 데이터 붙여넣기</label>
            <textarea id="excel-input" rows="4" placeholder="엑셀에서 복사한 데이터를 여기에 붙여넣으세요. (빈 줄도 포함하여 복사해야 나중에 엑셀에 붙여넣을 때 줄이 맞습니다)"></textarea>
            <div class="button-group">
                <button id="import-btn">목록 가져오기</button>
                <button id="load-json-btn" class="secondary">data.json 불러오기</button>
            </div>
        </section>

        <section id="task-list-section">
            <div class="list-header">
                <h2 class="section-label">할 일 목록</h2>
                <div class="batch-actions">
                    <label class="select-all-label"><input type="checkbox" id="select-all-cb"> 전체</label>
                    <button id="batch-copy-btn" class="secondary batch-btn">선택 복사</button>
                    <button id="batch-delete-btn" class="danger batch-btn">선택 삭제</button>
                </div>
            </div>
            <ul id="task-list">
                <!-- 할 일 목록이 여기에 렌더링됩니다 -->
            </ul>
            <p id="empty-message">데이터를 가져오면 목록이 표시됩니다.</p>
        </section>

        <section id="export-section">
            <h2 class="section-label">내보내기 / 연동 준비</h2>
            <button id="export-btn">결과 복사하기 (엑셀용)</button>
            <button id="download-json-btn" class="secondary" style="width: 100%; margin-bottom: 10px; padding: 12px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; color: white;">PC에 저장된 전체 일정 다운로드 (data.json)</button>
            <button id="reset-btn" class="danger">현재 날짜 데이터 초기화</button>
        </section>
    </div>

    <!-- 복사 모달 -->
    <div id="copy-modal" class="modal">
        <div class="modal-content">
            <h3>다른 날짜로 복사</h3>
            <p>복사할 날짜를 선택하세요.</p>
            <div id="date-checkboxes">
            </div>
            <div class="custom-date-add">
                <input type="date" id="custom-copy-date">
                <button id="add-custom-date-btn">추가</button>
            </div>
            <div class="modal-actions">
                <button id="confirm-copy-btn">복사하기</button>
                <button id="cancel-copy-btn" class="secondary">취소</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
